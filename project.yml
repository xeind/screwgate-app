name: Screwgate
options:
  bundleIdPrefix: com.screwgate
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_NAME: Screwgate
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.screwgate.app
    INFOPLIST_FILE: Screwgate/Info.plist
    CODE_SIGN_ENTITLEMENTS: Screwgate/Screwgate.entitlements
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_IDENTITY: "-"
    # Required so the global key monitor can fire
    # (user must grant Input Monitoring in System Settings)

targets:
  Screwgate:
    type: application
    platform: macOS
    sources:
      - path: Screwgate
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screwgate.app
